<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台電出入証產生器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
        }
        @media print {
            .no-print { display: none !important; }
        }
        .id-card-render {
            font-family: "BiauKai", "DFKai-SB", "Times New Roman", "PMingLiU", "MingLiU", "Microsoft JhengHei", serif !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const rawSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#0067B0" stroke-width="2.8"/><circle cx="50" cy="50" r="41.5" fill="none" stroke="#0067B0" stroke-width="2.8"/><circle cx="50" cy="50" r="36" fill="none" stroke="#0067B0" stroke-width="2.8"/><g fill="#E60012"><path d="M42 34 L32 16 L22 34 L32 34 Z" transform="rotate(-6 42 34)"/><path d="M58 34 L68 16 L78 34 L68 34 Z" transform="rotate(6 58 34)"/><path d="M42 66 L32 84 L22 66 L32 66 Z" transform="rotate(6 42 66)"/><path d="M58 66 L68 84 L78 66 L68 66 Z" transform="rotate(-6 58 66)"/></g><g fill="none" stroke="#0067B0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M50 24 L42 38 L58 38 Z" stroke-width="2.5"/><rect x="42.5" y="41" width="15" height="7.5"/><path d="M38 52 H62 M38 60 H62 M38 68 H62 M50 52 V78"/><path d="M50 78 L53 84" stroke-width="4"/></g></svg>`;
        const DEFAULT_LOGO = "data:image/svg+xml;base64," + btoa(rawSvg);

        const Icon = ({ d, size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d={d} />
            </svg>
        );
        const FileTextIcon = (props) => <Icon d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6" {...props} />;
        const LayoutGridIcon = (props) => <Icon d="M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z" {...props} />;
        const SquareIcon = (props) => <Icon d="M3 3h18v18H3z" {...props} />;
        const UploadIcon = (props) => <Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" {...props} />;
        const UserIcon = (props) => <Icon d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" {...props} />;
        const RefreshCwIcon = (props) => <Icon d="M21 2v6h-6 M3 12a9 9 0 0 1 15-6.7L21 8 M3 22v-6h6 M21 12a9 9 0 0 1-15 6.7L3 16" {...props} />;
        const FileDownIcon = (props) => <Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 3v12" {...props} />;
        const CheckCircleIcon = (props) => <Icon d="M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3" {...props} />;
        const AlertCircleIcon = (props) => <Icon d="M12 8v4 M12 16h.01 M22 12A10 10 0 1 1 2 12a10 10 0 0 1 20 0z" {...props} />;
        const ImageIcon = (props) => <Icon d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z M21 15l-5-5L5 21 M10 8h.01" {...props} />;

        const RealQRCode = ({ text }) => {
            const [qrSrc, setQrSrc] = useState('');
            useEffect(() => {
                if (window.QRious) {
                    const qr = new QRious({
                        value: text || 'TP',
                        size: 200, 
                        level: 'H'
                    });
                    setQrSrc(qr.toDataURL());
                }
            }, [text]);
            return (
                <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    {qrSrc ? <img src={qrSrc} style={{ width: '44px', height: '44px', display: 'block' }} alt="QR Code" /> : null}
                </div>
            );
        };

        const App = () => {
            const createEmptyCard = () => ({
                id: '', name: '', bloodType: 'O', photo: null, contractor: '', 
                project: '通霄電廠第二期更新改建計畫新161kV開關場統包工程',
                expiryDate: '2026-12-31', uuid: Math.random().toString(36).substring(7)
            });

            const [mode, setMode] = useState('batch'); 
            const [cards, setCards] = useState(Array.from({ length: 8 }, () => createEmptyCard()));
            const [singleCard, setSingleCard] = useState(createEmptyCard());
            const [isProcessing, setIsProcessing] = useState(false);
            const [customLogo, setCustomLogo] = useState(DEFAULT_LOGO);

            const formatDate = (dateStr) => {
                if (!dateStr) return "";
                const date = new Date(dateStr);
                const minguoYear = date.getFullYear() - 1911;
                return `至${minguoYear}年${date.getMonth() + 1}月${date.getDate()}日`;
            };

            const updateCardData = (index, field, value) => {
                if (mode === 'batch') {
                    const newCards = [...cards];
                    newCards[index][field] = value;
                    setCards(newCards);
                } else {
                    setSingleCard(prev => ({ ...prev, [field]: value }));
                }
            };

            const handlePhotoUpload = (index, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => updateCardData(index, 'photo', reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const generatePDF = async () => {
                const validCards = (mode === 'batch' ? cards : [singleCard]).filter(c => c.name.trim() !== "" || c.photo !== null);
                if (validCards.length === 0) { alert("請填寫姓名或上傳照片再進行匯出"); return; }
                setIsProcessing(true);
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                for (let i = 0; i < validCards.length; i++) {
                    const card = validCards[i];
                    const element = document.getElementById(`print-ref-${card.uuid}`);
                    const canvas = await html2canvas(element, { scale: 4, useCORS: true, backgroundColor: '#ffffff' });
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    const pageIdx = i % 8;
                    const col = pageIdx % 2;
                    const row = Math.floor(pageIdx / 2);
                    if (i > 0 && pageIdx === 0) doc.addPage();
                    doc.addImage(imgData, 'JPEG', 10 + (col * 100), 15 + (row * 65), 90, 55);
                }
                doc.save(`台電出入証_${new Date().getTime()}.pdf`);
                setIsProcessing(false);
            };

            const IDCard = ({ data, domId, logoSrc }) => (
                <div id={domId} className="id-card-render shrink-0" style={{ width: '340px', height: '236px', border: '2px solid black', backgroundColor: 'white', display: 'flex', flexDirection: 'column', boxSizing: 'border-box' }}>
                    <div style={{ width: '100%', height: '52px', borderBottom: '1.5px solid black', display: 'flex' }}>
                        <div style={{ width: '52px', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <img src={logoSrc} style={{ width: '42px', height: '42px' }} alt="LOGO" />
                        </div>
                        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <span style={{ fontSize: '15px', fontWeight: 'bold' }}>台灣電力公司綜合施工處工作證</span>
                        </div>
                        <div style={{ width: '52px', height: '100%', borderLeft: '1.5px solid black' }}>
                            <RealQRCode text={data.id} />
                        </div>
                    </div>
                    {/* (其他排版邏輯與您原本的一致) */}
                    <div style={{ width: '100%', height: '26px', borderBottom: '1.5px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <div style={{ width: '100%', display: 'flex', justifyContent: 'space-between', fontSize: '14px', fontWeight: 'bold', padding: '0 24px' }}>
                            {['承', '商', '人', '員', '工', '作', '證'].map((char, idx) => <span key={idx}>{char}</span>)}
                        </div>
                    </div>
                    <div style={{ width: '100%', height: '25px', borderBottom: '1.5px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <span style={{ fontSize: '11px', fontWeight: 'bold' }}>{data.project}</span>
                    </div>
                    <div style={{ width: '100%', flex: 1, display: 'flex' }}>
                        <div style={{ width: '85px', borderRight: '1.5px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            {data.photo ? <img src={data.photo} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <UserIcon size={55} style={{ color: '#e2e8f0' }} />}
                        </div>
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                            {[ { label: ["編", "號"], value: data.id }, { label: ["承", "商"], value: data.contractor }, { label: ["姓", "名"], value: data.name }, { label: ["血", "型"], value: data.bloodType }, { label: ["期", "限"], value: formatDate(data.expiryDate) } ].map((row, i) => (
                                <div key={i} style={{ flex: 1, display: 'flex', borderBottom: i !== 4 ? '1.5px solid black' : 'none' }}>
                                    <div style={{ width: '64px', borderRight: '1.5px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', fontWeight: 'bold' }}>
                                        {row.label[0]} {row.label[1]}
                                    </div>
                                    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', fontWeight: 'bold' }}>
                                        {row.value}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="p-8">
                    <button onClick={generatePDF} className="bg-blue-600 text-white p-4 rounded-xl mb-4">產生 PDF</button>
                    <div className="flex flex-wrap gap-4">
                        {(mode === 'batch' ? cards : [singleCard]).map((card, idx) => (
                            <IDCard key={card.uuid} data={card} domId={`print-ref-${card.uuid}`} logoSrc={customLogo} />
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
